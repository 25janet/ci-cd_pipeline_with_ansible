
---
- name: Deploy DevOps Task Tracker
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    image_tag: "{{ lookup('env', 'IMAGE_TAG') | default('latest', true) }}"

  tasks:
    - name: Ensure DevOps Task Tracker container is running
      community.docker.docker_container:
        name: devops-task-tracker
        image: "janetjohn15/devops-task-tracker:{{ image_tag }}"
        state: started
        pull: true
        restart_policy: "no"

    - name: Inspect DevOps Task Tracker container
      community.docker.docker_container_info:
        name: devops-task-tracker
      register: container_info

    - name: Verify container exited successfully
      ansible.builtin.assert:
        that:
          - container_info.container.State.Status == "exited"
          - container_info.container.State.ExitCode == 0
        success_msg: "Container exited successfully"
        fail_msg: "Container did not exit successfully"

    - name: Read DevOps Task Tracker container logs
      ansible.builtin.command:
        argv:
          - docker
          - logs
          - devops-task-tracker
      register: container_logs
      changed_when: false
      check_mode: false

    - name: Verify expected application output
      ansible.builtin.assert:
        that:
          - "'Devops Task Tracker is running' in container_logs.stdout"
        success_msg: "Application output verified successfully"
        fail_msg: "Expected application output was not found in container logs"
